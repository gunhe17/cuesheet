<!DOCTYPE html>
<html lang="en" dir="ltr" class="relative min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Preline UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/main.min.css">
</head>
<body class="bg-white dark:bg-neutral-900"><!-- Card Blog -->
  <div class="max-w-340 px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
    <!-- Grid -->
    <div class="grid lg:grid-cols-2 gap-6">
      <!-- Card -->
      <a class="group sm:flex rounded-xl focus:outline-hidden" href="#">
        <div class="shrink-0 relative rounded-xl overflow-hidden h-50 sm:w-62.5 sm:h-87.5 w-full bg-surface">
          <img class="size-full absolute top-0 inset-s-0 object-cover" src="https://images.unsplash.com/photo-1664574654529-b60630f33fdb?ixlib=rb-4.0.3&ixid=MnwxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=560&q=80" alt="Blog Image">
        </div>

        <div class="grow">
          <div class="p-4 flex flex-col h-full sm:p-6">
            <div class="mb-3">
              <p class="inline-flex items-center gap-1.5 py-1.5 px-3 rounded-md text-xs font-medium bg-surface text-surface-foreground">
                Business
              </p>
            </div>
            <h3 class="text-lg sm:text-2xl font-semibold text-foreground group-hover:text-primary-hover group-focus:text-primary-focus">
              Preline becomes an official Instagram Marketing Partner
            </h3>
            <p class="mt-2 text-muted-foreground-2">
              Great news we're eager to share.
            </p>

            <div class="mt-5 sm:mt-auto">
              <!-- Avatar -->
              <div class="flex items-center">
                <div class="shrink-0">
                  <img class="size-11 rounded-full" src="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=facearea&facepad=2&w=320&h=320&q=80" alt="Avatar">
                </div>
                <div class="ms-2.5 sm:ms-4">
                  <h4 class="font-semibold text-foreground">
                    Aaron Larsson
                  </h4>
                  <p class="text-xs text-muted-foreground-1">
                    Feb 15, 2021
                  </p>
                </div>
              </div>
              <!-- End Avatar -->
            </div>
          </div>
        </div>
      </a>
      <!-- End Card -->

      <!-- Card -->
      <a class="group sm:flex rounded-xl focus:outline-hidden" href="#">
        <div class="shrink-0 relative rounded-xl overflow-hidden h-50 sm:w-62.5 sm:h-87.5 w-full">
          <img class="size-full absolute top-0 inset-s-0 object-cover" src="https://images.unsplash.com/photo-1669824774762-65ddf29bee56?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=560&q=80" alt="Blog Image">
        </div>
        <div class="grow">
          <div class="p-4 flex flex-col h-full sm:p-6">
            <div class="mb-3">
              <p class="inline-flex items-center gap-1.5 py-1.5 px-3 rounded-md text-xs font-medium bg-surface text-surface-foreground">
                Announcements
              </p>
            </div>
            <h3 class="text-lg sm:text-2xl font-semibold text-foreground group-hover:text-primary-hover group-focus:text-primary-focus">
              Announcing a free plan for small teams
            </h3>
            <p class="mt-2 text-muted-foreground-2">
              At Wake, our mission has always been focused on bringing openness.
            </p>

            <div class="mt-5 sm:mt-auto">
              <!-- Avatar -->
              <div class="flex items-center">
                <div class="shrink-0">
                  <img class="size-11 rounded-full" src="https://images.unsplash.com/photo-1669720229052-89cda125fc3f?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=facearea&facepad=2&w=320&h=320&q=80" alt="Avatar">
                </div>
                <div class="ms-2.5 sm:ms-4">
                  <h4 class="font-semibold text-foreground">
                    Hanna Wolfe
                  </h4>
                  <p class="text-xs text-muted-foreground-1">
                    Feb 4, 2021
                  </p>
                </div>
              </div>
              <!-- End Avatar -->
            </div>
          </div>
        </div>
      </a>
      <!-- End Card -->
    </div>
    <!-- End Grid -->
  </div>
  <!-- End Card Blog -->
  <script src="../../../assets/preline.js"></script>

                <script>
                    window.defaultVariables = {"baseUrl":"https:\/\/preline.co"};
                </script></body>
</html>
