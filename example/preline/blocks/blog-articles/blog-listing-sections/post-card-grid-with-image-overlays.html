<!DOCTYPE html>
<html lang="en" dir="ltr" class="relative min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Preline UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/main.min.css">
</head>
<body class="bg-white dark:bg-neutral-900"><!-- Card Blog -->
  <div class="max-w-340 px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
    <!-- Grid -->
    <div class="grid lg:grid-cols-2 gap-6">
      <!-- Card -->
      <a class="group relative block rounded-xl focus:outline-hidden" href="#">
        <div class="shrink-0 relative rounded-xl overflow-hidden w-full h-87.5 before:absolute before:inset-x-0 before:z-1 before:size-full before:bg-linear-to-t before:from-inverse/70">
          <img class="size-full absolute top-0 inset-s-0 object-cover" src="https://images.unsplash.com/photo-1669828230990-9b8583a877ab?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=560&q=80" alt="Blog Image">
        </div>

        <div class="absolute top-0 inset-x-0 z-10">
          <div class="p-4 flex flex-col h-full sm:p-6">
            <!-- Avatar -->
            <div class="flex items-center">
              <div class="shrink-0">
                <img class="size-11 border-2 border-white rounded-full" src="https://images.unsplash.com/photo-1669837401587-f9a4cfe3126e?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=facearea&facepad=2&w=320&h=320&q=80" alt="Avatar">
              </div>
              <div class="ms-2.5 sm:ms-4">
                <h4 class="font-semibold text-foreground-inverse">
                  Gloria
                </h4>
                <p class="text-xs text-foreground-inverse/80">
                  Jan 09, 2021
                </p>
              </div>
            </div>
            <!-- End Avatar -->
          </div>
        </div>

        <div class="absolute bottom-0 inset-x-0 z-10">
          <div class="flex flex-col h-full p-4 sm:p-6">
            <h3 class="text-lg sm:text-3xl font-semibold text-foreground-inverse group-hover:text-foreground-inverse/80 group-focus:text-foreground-inverse/80">
              Facebook is creating a news section in Watch to feature breaking news
            </h3>
            <p class="mt-2 text-foreground-inverse/80">
              Facebook launched the Watch platform in August
            </p>
          </div>
        </div>
      </a>
      <!-- End Card -->

      <!-- Card -->
      <a class="group relative block rounded-xl focus:outline-hidden" href="#">
        <div class="shrink-0 relative rounded-xl overflow-hidden w-full h-87.5 before:absolute before:inset-x-0 before:z-1 before:size-full before:bg-linear-to-t before:from-inverse/70">
          <img class="size-full absolute top-0 inset-s-0 object-cover" src="https://images.unsplash.com/photo-1611625618313-68b87aaa0626?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=560&q=80" alt="Blog Image">
        </div>

        <div class="absolute top-0 inset-x-0 z-10">
          <div class="p-4 flex flex-col h-full sm:p-6">
            <!-- Avatar -->
            <div class="flex items-center">
              <div class="shrink-0">
                <img class="size-11 border-2 border-white rounded-full" src="https://images.unsplash.com/photo-1669837401587-f9a4cfe3126e?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=facearea&facepad=2&w=320&h=320&q=80" alt="Avatar">
              </div>
              <div class="ms-2.5 sm:ms-4">
                <h4 class="font-semibold text-foreground-inverse">
                  Gloria
                </h4>
                <p class="text-xs text-foreground-inverse/80">
                  May 30, 2021
                </p>
              </div>
            </div>
            <!-- End Avatar -->
          </div>
        </div>

        <div class="absolute bottom-0 inset-x-0 z-10">
          <div class="flex flex-col h-full p-4 sm:p-6">
            <h3 class="text-lg sm:text-3xl font-semibold text-foreground-inverse group-hover:text-foreground-inverse/80 group-focus:text-foreground-inverse/80">
              What CFR (Conversations, Feedback, Recognition) really is about
            </h3>
            <p class="mt-2 text-foreground-inverse/80">
              For a lot of people these days, Measure What Matters.
            </p>
          </div>
        </div>
      </a>
      <!-- End Card -->
    </div>
    <!-- End Grid -->
  </div>
  <!-- End Card Blog -->
  <script src="../../../assets/preline.js"></script>

                <script>
                    window.defaultVariables = {"baseUrl":"https:\/\/preline.co"};
                </script></body>
</html>
