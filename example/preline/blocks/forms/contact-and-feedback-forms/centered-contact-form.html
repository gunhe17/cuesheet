<!DOCTYPE html>
<html lang="en" dir="ltr" class="relative min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Preline UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/main.min.css">
</head>
<body class="bg-white dark:bg-neutral-900"><!-- Hire Us -->
  <div class="max-w-340 px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
    <div class="max-w-xl mx-auto">
      <div class="text-center">
        <h1 class="text-3xl font-bold text-foreground sm:text-4xl">
          Ready to hire us?
        </h1>
        <p class="mt-1 text-muted-foreground-2">
          Tell us your story and we’ll be in touch.
        </p>
      </div>

      <div class="mt-12">
        <!-- Form -->
        <form>
          <div class="grid gap-4 lg:gap-6">
            <!-- Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6">
              <div>
                <label for="hs-firstname-hire-us-2" class="block mb-2 text-sm text-foreground font-medium">First Name</label>
                <input type="text" name="hs-firstname-hire-us-2" id="hs-firstname-hire-us-2" class="py-2.5 sm:py-3 px-4 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:ring-primary-focus disabled:opacity-50 disabled:pointer-events-none">
              </div>

              <div>
                <label for="hs-lastname-hire-us-2" class="block mb-2 text-sm text-foreground font-medium">Last Name</label>
                <input type="text" name="hs-lastname-hire-us-2" id="hs-lastname-hire-us-2" class="py-2.5 sm:py-3 px-4 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:ring-primary-focus disabled:opacity-50 disabled:pointer-events-none">
              </div>
            </div>
            <!-- End Grid -->

            <div>
              <label for="hs-work-email-hire-us-2" class="block mb-2 text-sm text-foreground font-medium">Work Email</label>
              <input type="email" name="hs-work-email-hire-us-2" id="hs-work-email-hire-us-2" autocomplete="email" class="py-2.5 sm:py-3 px-4 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:ring-primary-focus disabled:opacity-50 disabled:pointer-events-none">
            </div>

            <!-- Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6">
              <div>
                <label for="hs-company-hire-us-2" class="block mb-2 text-sm text-foreground font-medium">Company</label>
                <input type="text" name="hs-company-hire-us-2" id="hs-company-hire-us-2" class="py-2.5 sm:py-3 px-4 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:ring-primary-focus disabled:opacity-50 disabled:pointer-events-none">
              </div>

              <div>
                <label for="hs-company-website-hire-us-2" class="block mb-2 text-sm text-foreground font-medium">Company Website</label>
                <input type="text" name="hs-company-website-hire-us-2" id="hs-company-website-hire-us-2" class="py-2.5 sm:py-3 px-4 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:ring-primary-focus disabled:opacity-50 disabled:pointer-events-none">
              </div>
            </div>
            <!-- End Grid -->

            <div>
              <label for="hs-about-hire-us-2" class="block mb-2 text-sm text-foreground font-medium">Details</label>
              <textarea id="hs-about-hire-us-2" name="hs-about-hire-us-2" rows="4" class="py-2.5 sm:py-3 px-4 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:ring-primary-focus disabled:opacity-50 disabled:pointer-events-none"></textarea>
            </div>
          </div>
          <!-- End Grid -->

          <!-- Checkbox -->
          <div class="mt-3 flex">
            <div class="flex">
              <input id="remember-me" name="remember-me" type="checkbox" class="mt-1 shrink-0 size-4 bg-transparent border-line-3 rounded-sm shadow-2xs text-primary focus:ring-0 focus:ring-offset-0 checked:bg-primary-checked checked:border-primary-checked disabled:opacity-50 disabled:pointer-events-none">
            </div>
            <div class="ms-3">
              <label for="remember-me" class="text-sm text-muted-foreground-2">By submitting this form I have read and acknowledged the <a class="text-primary decoration-2 hover:underline focus:outline-hidden focus:underline font-medium" href="#">Privact policy</a></label>
            </div>
          </div>
          <!-- End Checkbox -->

          <div class="mt-6 grid">
            <button type="submit" class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg bg-primary border border-primary-line text-primary-foreground hover:bg-primary-hover focus:outline-hidden focus:bg-primary-focus disabled:opacity-50 disabled:pointer-events-none">Send inquiry</button>
          </div>

          <div class="mt-3 text-center">
            <p class="text-sm text-muted-foreground-1">
              We'll get back to you in 1-2 business days.
            </p>
          </div>
        </form>
        <!-- End Form -->
      </div>
    </div>
  </div>
  <!-- End Hire Us -->
  <script src="../../../assets/preline.js"></script>

                <script>
                    window.defaultVariables = {"baseUrl":"https:\/\/preline.co"};
                </script></body>
</html>
