<!DOCTYPE html>
<html lang="en" dir="ltr" class="relative min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Preline UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/main.min.css">
</head>
<body>
  <div class="fixed bottom-0 inset-e-0 z-60 sm:max-w-sm w-full mx-auto p-6">
    <!-- Card -->
    <div class="p-4 bg-linear-to-br from-violet-700 to-sky-500 rounded-xl shadow-2xs">
      <p class="mt-2 text-sm text-foreground-inverse">
        This website uses cookies to enhance your browsing experience.
      </p>
      <a class="mt-3 inline-flex justify-center items-center gap-x-1 font-semibold text-foreground-inverse/80 text-sm hover:text-foreground-inverse focus:outline-hidden focus:text-foreground-inverse" href="#">
        Learn more
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </a>
      <div class="mt-5 flex justify-between gap-x-2">
        <button type="button" class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-full border-2 border-line-inverse text-foreground-inverse focus:outline-hidden focus:border-line-inverse/70 focus:text-foreground-inverse/70 focus:border-line-inverse/70focus:text-foreground-inverse/70 disabled:opacity-50 disabled:pointer-events-none">
          Accept all
        </button>
        <button type="button" class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-full border border-transparent text-foreground-inverse hover:text-foreground-inverse/70 focus:outline-hidden focus:text-foreground-inverse/70 disabled:opacity-50 disabled:pointer-events-none">
          Reject all
        </button>
      </div>
    </div>
    <!-- End Card -->
  </div>

  <script src="../../../assets/preline.js"></script>

                <script>
                    window.defaultVariables = {"baseUrl":"https:\/\/preline.co"};
                </script></body>
</html>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.querySelectorAll('.hs-overlay').forEach((el) => HSOverlay.open(el));
    });
  });
</script>
