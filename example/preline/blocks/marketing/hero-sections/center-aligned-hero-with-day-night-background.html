<!DOCTYPE html>
<html lang="en" dir="ltr" class="relative min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Preline UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/main.min.css">
  <style>
    @keyframes hs-hero-day-night
    {

      0%,
      18%
      {
        opacity: 0;
      }

      42%,
      62%
      {
        opacity: 1;
      }

      86%,
      100%
      {
        opacity: 0;
      }
    }
  </style>
</head>
<body class="bg-white dark:bg-neutral-900"><!-- Hero -->
  <div class="relative overflow-hidden">
    <div class="pointer-events-none absolute inset-0 z-0 overflow-hidden" aria-hidden="true">
      <div class="absolute inset-0 bg-cover bg-center bg-no-repeat" style="background-image: url('https://preline.co/assets/img/hero/valley.webp')"></div>
      <div class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-0 motion-reduce:animate-none animate-[hs-hero-day-night_22s_ease-in-out_infinite]" style="background-image: url('https://preline.co/assets/img/hero/valley-night.webp')"></div>
      <div class="absolute inset-0 bg-inverse/25"></div>
    </div>

    <div class="relative z-10 max-w-340 mx-auto px-4 sm:px-6 lg:px-8 py-24 min-h-150 md:min-h-[80dvh] flex flex-col justify-center space-y-8">
      <!-- Announcement Banner -->
      <div class="flex justify-center">
        <a class="group inline-flex items-center bg-layer/40 hover:bg-layer/50 p-1 ps-4 rounded-full shadow-lg shadow-transparent backdrop-blur-xl focus:outline-hidden focus:bg-layer/50" href="#">
          <p class="me-2 text-layer-foreground text-sm">
            We just raised $20M
          </p>
          <span class="group-hover:bg-layer/50 py-1.5 px-2.5 flex justify-center items-center gap-x-2 rounded-full bg-layer/50 font-semibold text-layer-foreground text-sm">
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </span>
        </a>
      </div>
      <!-- End Announcement Banner -->

      <!-- Title -->
      <div class="max-w-3xl text-center mx-auto">
        <h1 class="block font-semibold text-foreground-inverse text-4xl sm:text-5xl md:text-6xl lg:text-7xl">
          Design with ease.
        </h1>
      </div>
      <!-- End Title -->

      <div class="max-w-3xl text-center mx-auto">
        <p class="text-lg text-foreground-inverse/80">Design smarter with AI that understands you. So you can take a breath.</p>
      </div>

      <!-- Buttons -->
      <div class="text-center">
        <div class="inline-flex flex-wrap justify-center items-center gap-3">
          <a class="py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-full bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-hover" href="#">
            Get Started
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
          <a class="py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-full border border-transparent text-foreground-inverse hover:bg-plain/10 focus:outline-hidden focus:bg-plain/10" href="#">
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            Watch Demo
          </a>
        </div>
      </div>
      <!-- End Buttons -->
    </div>
  </div>
  <!-- End Hero -->
  <script src="../../../assets/preline.js"></script>

                <script>
                    window.defaultVariables = {"baseUrl":"https:\/\/preline.co"};
                </script></body>
</html>
