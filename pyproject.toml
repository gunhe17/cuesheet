[project]
name = "cuesheet"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
app = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "argon2-cffi",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cuesheet*"]
namespaces = true
